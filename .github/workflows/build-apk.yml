name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Verifying Java environment..."
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STR"

          if [ -z "$JAVA_VER_STR" ]; then
            echo "ERROR: Could not detect Java version string." >&2
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VER_STR" | awk -F '.' '{ if ($1 == "1") print $2; else print $1; }')
          echo "Detected Java major version: $MAJOR_VERSION"

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version from '$JAVA_VER_STR'." >&2
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java major version ($MAJOR_VERSION) is lower than 17." >&2
            exit 1
          fi

          echo "Java environment verification successful (Java $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "$KEYSTORE_PATH" ]; then
              echo "ERROR: Failed to create $KEYSTORE_PATH" >&2
              exit 1
            fi
            echo "Temporary debug.keystore successfully generated."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at: $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "app/build/outputs/apk directory does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK file ($EXPECTED_APK) exists but is empty (0 bytes)." >&2
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: Expected file ($EXPECTED_APK) does not have .apk extension." >&2
            exit 1
          fi

          echo "APK successfully verified at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$ORIGINAL_APK" ] || [ ! -s "$ORIGINAL_APK" ]; then
            echo "ERROR: Original APK missing or empty at $ORIGINAL_APK" >&2
            exit 1
          fi

          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SANITIZED=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_SANITIZED" ]; then
            REPO_SANITIZED="android-app"
          fi

          RELEASE_ASSET_NAME="${REPO_SANITIZED}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-asset-XXXXXX")
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"

          cp "$ORIGINAL_APK" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $RELEASE_ASSET_PATH" >&2
            exit 1
          fi

          echo "Release asset prepared: $RELEASE_ASSET_PATH ($RELEASE_ASSET_NAME)"
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_PATH" >&2
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset at $ASSET_PATH is empty" >&2
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH" >&2
            exit 1
          fi

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### ZYRON Android Debug APK Build

          * **Build Type:** Automatically generated debug APK
          * **Built by:** GitHub Actions
          * **Run Number:** ${GITHUB_RUN_NUMBER}
          * **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          * **Source Commit:** ${GITHUB_SHA}
          * **Asset Filename:** ${ASSET_NAME}

          > **Notice:**
          > - This APK is intended for testing and development preview.
          > - This APK is **not** a Google Play Store production release.
          > - This APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "GitHub Release successfully created with tag: $TAG_NAME"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== RELEASE PUBLISHING SUCCEEDED ==="
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "APK Asset Name: $ASSET_NAME"

            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}")
            echo "Release Page URL: $RELEASE_URL"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "* **Release Title:** ${RELEASE_TITLE}"
              echo "* **Release Tag:** \`${TAG_NAME}\`"
              echo "* **APK Asset File:** \`${ASSET_NAME}\`"
              echo "* **Direct Release URL:** [View GitHub Release](${RELEASE_URL})"
              echo ""
              echo "### 📲 How to Download on your Phone:"
              echo "1. Open the [Release Page](${RELEASE_URL})."
              echo "2. Under the **Assets** section, download \`${ASSET_NAME}\` directly onto your Android device."
              echo "3. Open the downloaded \`.apk\` to install."
              echo ""
              echo "*(Note: The standard GitHub Actions artifact \`app-debug-apk\` is also preserved and available as a backup.)*"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=== WARNING: RELEASE PUBLISHING FAILED OR SKIPPED ==="
            echo "The debug APK build succeeded and the GitHub Actions artifact is preserved."
            echo "Artifact Name: app-debug-apk"

            {
              echo "## ⚠️ Debug APK Built - Release Publishing Warning"
              echo ""
              echo "The debug APK build was **successful**, and the Actions artifact \`app-debug-apk\` has been safely uploaded."
              echo "However, publishing directly to GitHub Releases was unsuccessful or skipped."
              echo ""
              echo "### 📦 Backup APK Download:"
              echo "You can download the compiled APK (\`app-debug.apk\`) directly from the **Artifacts** section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
